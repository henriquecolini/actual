name: Build custom server image

# Builds this fork's sync server (with the AI assistant and icons) and pushes it
# to GitHub Container Registry as a multi-arch image. amd64 and arm64 are built
# natively on their own runners, then merged into one tag.

on:
  push:
    branches: [custom]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/actual-server

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sync-server.Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.suffix }}
          push: true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch tags
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:custom" \
            -t "$IMAGE:${GITHUB_SHA::12}" \
            "$IMAGE:${GITHUB_SHA}-amd64" \
            "$IMAGE:${GITHUB_SHA}-arm64"
